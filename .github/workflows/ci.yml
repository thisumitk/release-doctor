name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Verify selected Node.js runtime
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node-version }}
        run: node -e 'require("node:assert/strict").equal(process.versions.node.split(".")[0], process.env.EXPECTED_NODE_MAJOR); console.log(process.version)'
      - run: npm ci
      - run: npm run check
